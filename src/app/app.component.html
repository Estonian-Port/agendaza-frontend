<div class="layout">
  <app-navbar class="navbar-layout" (menuToggle)="sidebar.toggleSidebar()"></app-navbar>

  <app-sidebar #sidebar class="sidebar-layout"></app-sidebar>

  <div class="content-layout" [@routeAnimation]="route.snapshot.data">
    <router-outlet></router-outlet>
  </div>

  <app-toast-container></app-toast-container>
</div>

<app-modal-basico
  [modal]="updateAvailable"
  titulo="Actualización disponible"
  cuerpo="Hay una nueva versión de la aplicación. Actualizá para continuar."
  boton="Actualizar"
  (outputAceptar)="applyUpdate()"
  (outputChangeModal)="updateAvailable = $event">
</app-modal-basico>
