<div *ngIf="modal">
  <div class="modal-backgroud"></div>
  <div class="modal fade modal-display">
    <div class="modal-dialog modal-correcion-altura" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalRangoBalanceLabel">{{titulo}}</h5>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="text-muted form-label">Desde</label>
              <input type="month" class="form-control" [(ngModel)]="balanceDesde" [max]="balanceHasta">
            </div>
            <div class="col-md-6">
              <label class="text-muted form-label">Hasta</label>
              <input type="month" class="form-control" [(ngModel)]="balanceHasta" [max]="mesActualISO">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="changeModal()" [disabled]="ocupado">
            Cerrar
          </button>

          <button type="button" class="btn btn-success" (click)="confirmarPlanilla()"
            [disabled]="ocupado || rangoInvalido">
            <span *ngIf="descargandoPlanilla" class="spinner-border spinner-border-sm me-0 me-md-2" role="status" aria-hidden="true"></span>
            <i *ngIf="!descargandoPlanilla" class="fas fa-file-excel me-0 me-md-2" aria-hidden="true"></i>
            <span class="d-none d-md-inline">Descargar planilla</span>
          </button>

          <button type="button" class="btn btn-primary" (click)="confirmar()"
            [disabled]="ocupado || rangoInvalido">
            <span *ngIf="descargandoBalance" class="spinner-border spinner-border-sm me-0 me-md-2" role="status" aria-hidden="true"></span>
            <i *ngIf="!descargandoBalance" class="fas fa-download me-0 me-md-2" aria-hidden="true"></i>
            <span class="d-none d-md-inline">Descargar balance</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
