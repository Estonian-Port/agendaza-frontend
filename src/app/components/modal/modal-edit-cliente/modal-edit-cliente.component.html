<div *ngIf="modal">
    
  <div  class="modal-backgroud"></div>
  
  <div class="modal fade modal-display">
      <div class="modal-dialog modal-correcion-altura" role="document">
          <div class="modal-content">
              <div class="modal-header">
                  <h5 class="modal-title" id="exampleModalLabel">{{titulo}}</h5>
              </div>
              <form (ngSubmit)="save()">
                <div class="modal-body">
                    <label for="cliente-nombre">Nombre</label>
                    <input id="cliente-nombre" type="text" class="form-control" name="nombre" [(ngModel)]="clienteEditado.nombre" required>
                </div>
                <div class="modal-body">
                  <label for="cliente-apellido">Apellido</label>
                  <input id="cliente-apellido" type="text" class="form-control" name="apellido" [(ngModel)]="clienteEditado.apellido" required>
                </div>
                <div class="modal-body">
                  <label for="cliente-telefono">Teléfono</label>
                  <input id="cliente-telefono" type="text" inputmode="numeric" pattern="[0-9]*" class="form-control" name="telefono" [(ngModel)]="clienteEditado.celular">
                </div>
                <div class="modal-body">
                  <label for="cliente-email">Email</label>
                  <input id="cliente-email" type="text" class="form-control" name="email" [(ngModel)]="clienteEditado.email">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" (click)="changeModal()">Cerrar</button>
                    <button type="submit" class="btn btn-success">Guardar</button>
                </div>
              </form>
          </div>
      </div>
  </div>

</div>
