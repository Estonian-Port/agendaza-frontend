<div class="form-group col-lg-4 col-md-12 mb-3">
    <h5 class="form-label w-100">Hora inicio</h5>
        <div class="d-inline-flex flex-row">
            <div>
                <div class="form-group">
                    <div class="form-group">
                        <select class="form-control" name="time_start_hour" [(ngModel)]="inicio.hour" (ngModelChange)="changeInicio()">
                            <option *ngFor="let minuto of listaHora| orderAbmById" [value]="minuto">{{minuto}}</option>
                        </select>
                    </div> 
                </div>       
            </div>
        <div>
            <div class="p-1">:</div>
        </div>
            <div>
                <div class="form-group">
                    <select class="form-control" name="time_start_minute" [(ngModel)]="inicio.minute" (ngModelChange)="changeInicio()">
                        <option *ngFor="let minuto of listaMinuto| orderAbmById" [value]="minuto">{{minuto}}</option>
                    </select>
                </div> 
            </div>
        </div>
</div>
    
<div class="form-group col-lg-4 col-md-12 mb-3" id="time_end_div">
    <input id="time_end" type="hidden" th:field="*{fin}">
    <h5 class="form-label w-100">Hora final</h5>
    <div class="d-inline-flex flex-row">
        <div>
            <div class="form-group">
                <select class="form-control" name="time_end_hour" [(ngModel)]="fin.hour" (ngModelChange)="changeFin()">
                    <option *ngFor="let minuto of listaHora| orderAbmById" [value]="minuto">{{minuto}}</option>
                </select>
            </div> 
        </div>
        <div>
            <div class="p-1"> : </div>
        </div>
        <div>
            <div class="form-group">
                <select class="form-control" name="time_end_minute" [(ngModel)]="fin.minute" (ngModelChange)="changeFin()">
                    <option *ngFor="let minuto of listaMinuto| orderAbmById" [value]="minuto">{{minuto}}</option>
                </select>
            </div> 
        </div>
    </div>
</div>

<div class="col-lg-4 col-md-12 mb-3" role="status">
    <span *ngIf="hastaElOtroDiaCheckbox" class="badge text-bg-primary">Dura hasta el otro día</span>
    <span *ngIf="!hastaElOtroDiaCheckbox" class="badge text-bg-secondary">Finaliza el mismo día</span>
</div>
