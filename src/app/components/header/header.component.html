<div class="row contenedor-default mt-3">
  <h2 class="col-6">{{titulo}}</h2>
  
  <div class="col-6">
      <div class="header-acciones gap-2 d-flex justify-content-end">
          <div class="header-volver">
              <div *ngIf="botonVolver">
                <a class="btn btn-primary" (click)="volver()">Volver</a>
              </div>
          </div>
          <div *ngIf="botonCambiarContrasenia">
            <button type="submit" class="btn btn-warning" (click)="cambiarContrasenia()" aria-label="Cambiar contraseña"><i class="fas fa-key" aria-hidden="true"></i><span class="header-boton-texto"> Cambiar contraseña</span></button>
          </div>
          <div *ngIf="botonSave">
              <button type="submit" class="btn btn-success" (click)="save()" aria-label="Guardar"><i class="fas fa-save" aria-hidden="true"></i><span class="header-boton-texto"> Guardar</span></button>
          </div>
          <div *ngIf="botonDescargar">
              <button type="button" class="btn btn-primary" (click)="descargar()" [disabled]="descargaEnCurso"
                [attr.aria-label]="descargaEnCurso ? 'Descargando' : 'Descargar'">
                <span *ngIf="descargaEnCurso" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                <i *ngIf="!descargaEnCurso" class="fas fa-download" aria-hidden="true"></i>
              </button>
          </div>
          <div *ngIf="botonEmail">
              <button type="button" class="btn btn-primary" (click)="enviarEmail()" [disabled]="emailEnCurso"
                [attr.aria-label]="emailEnCurso ? 'Enviando correo' : 'Enviar correo'">
                <span *ngIf="emailEnCurso" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                <i *ngIf="!emailEnCurso" class="fas fa-envelope" aria-hidden="true"></i>
              </button>
          </div>
          <div *ngIf="botonAgregar">
            <button type="submit" class="btn btn-success" (click)="agregar()" aria-label="Agregar"><i class="fas fa-plus-circle" aria-hidden="true"></i></button>
          </div>
          <div *ngIf="botonAgregarSecundario">
            <button type="submit" class="btn btn-danger" (click)="agregarSecundario()" aria-label="Agregar"><i class="fas fa-plus-circle" aria-hidden="true"></i></button>
          </div>
      </div>
  </div>
</div>
