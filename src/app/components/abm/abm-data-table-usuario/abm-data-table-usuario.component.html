
<div class="table-responsive">
    <table class="table table-striped table-hover table-condensed example-animate-container">
        <thead>
            <tr>
                <th [class.d-none]="!esCliente" [class.d-md-table-cell]="!esCliente">Nombre</th>
                <th [class.d-none]="!esCliente" [class.d-md-table-cell]="!esCliente">Apellido</th>
                <th *ngIf="!esCliente">Email</th>
                <th *ngIf="!esCliente">Estado</th>
                <th class="d-flex justify-content-center">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngIf="listaItems.length === 0">
                <td [attr.colspan]="esCliente ? 3 : 5" class="text-center text-muted p-3">No se encontraron {{nombreItems}}.</td>
            </tr>
            <tr *ngFor="let item of listaItems | orderAbmByNombre">
                <td class="dimensiones-tabla-monto" [class.d-none]="!esCliente" [class.d-md-table-cell]="!esCliente">
                    <ng-container *ngIf="esCliente || esUsuarioActivo(item)">{{item.nombre}}</ng-container>
                </td>
                <td class="dimensiones-tabla-texto" [class.d-none]="!esCliente" [class.d-md-table-cell]="!esCliente">
                    <ng-container *ngIf="esCliente || esUsuarioActivo(item)">{{item.apellido | truncarTexto}}</ng-container>
                </td>
                <td *ngIf="!esCliente">{{item.email}}</td>
                <td *ngIf="!esCliente">
                    <span class="badge rounded-pill text-bg-success" *ngIf="esUsuarioActivo(item)">Activo</span>
                    <span class="badge rounded-pill text-bg-secondary" *ngIf="!esUsuarioActivo(item)">Pendiente</span>
                </td>

                <td class="center-items-abm">
                    <button *ngIf="!esCliente" (click)="cambiarRol(item.id)" class="text-warning mx-2">
                        <i class="fas fa-user-tag fa-lg" data-bs-toggle="tooltip" title="Cambiar Rol"></i>
                    </button>
                    <button *ngIf="!esCliente" (click)="resetearPassword(item.id)" class="text-secondary mx-2">
                        <i class="fas fa-key fa-lg" data-bs-toggle="tooltip" title="Resetear Contraseña"></i>
                    </button>
                    <button *ngIf="esCliente" (click)="editarCliente(item.id)" class="text-secondary mx-2">
                        <i class="fas fa-edit fa-lg" data-bs-toggle="tooltip" title="Editar Usuario"></i>
                    </button>
                    <button (click)="modalParaEliminar(item.id, nombreEmpresa)" class="mx-2">
                        <i class="fas fa-trash text-danger fa-lg" data-bs-toggle="tooltip" title="Eliminar"></i>
                    </button>

                </td>
            </tr>
        </tbody>
    </table>
</div>

<app-modal-basico
    (outputAceptar)="eliminar($event)"
    (outputChangeModal)="setModal($event)"
    [modal]="modal"
    [titulo]="tituloModal"
    [cuerpo]="cuerpoModal"
    [boton]="botonModal">
</app-modal-basico>
