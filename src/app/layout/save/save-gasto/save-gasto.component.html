<div class="container">
    <form>

        <app-header
            [titulo]="gasto.id ? 'Editar gasto' : 'Agregar gasto'"
            (outputVolver)="volver()"
            [botonSave]="true"
            (outputSave)="save()">
        </app-header>

        <div class="row contenedor-default mt-2">

            <div class="col-lg-4 col-md-12 mb-4">
                <label for="fecha">Fecha</label>
                <input type="datetime-local" class="form-control" name="fecha" [(ngModel)]="gasto.fecha">
            </div>

            <div class="col-7"></div>

            <div class="col-lg-4 col-md-12 mb-4">
                <label for="tipoGasto">Tipo de gasto</label>
                <select class="form-select" [(ngModel)]="gasto.tipoGasto" name="tipoGasto">
                    <option *ngFor="let tipo of listaTipoGasto" [value]="tipo">{{tipo | formatEnum}}</option>
                </select>
            </div>

            <div class="col-lg-4 col-md-12 mb-4">
                <label for="descripcion">Descripción</label>
                <input type="text" maxlength="255" class="form-control" name="descripcion" [(ngModel)]="gasto.descripcion"/>
            </div>

            <div class="col-4"></div>

            <div class="col-lg-4 col-md-12 mb-4">
                <label for="codigoEvento">
                    Evento <span class="text-muted" *ngIf="!requiereEvento">(opcional)</span>
                </label>
                <app-evento-seleccionado
                    *ngIf="gasto.codigoEvento && !cambiandoEvento"
                    [nombre]="gasto.nombreEvento || 'Evento vinculado'"
                    [codigo]="gasto.codigoEvento"
                    [fechaInicio]="eventoSeleccionado?.inicio || ''"
                    (outputCambiar)="quitarEvento()">
                </app-evento-seleccionado>
                <div *ngIf="!gasto.codigoEvento || cambiandoEvento">
                    <div class="event-search">
                    <div class="d-flex gap-2 align-items-start">
                        <select class="form-select flex-shrink-0" style="width: 140px" [(ngModel)]="modoBusqueda" name="modoBusquedaEvento">
                            <option value="fecha">Por fecha</option>
                            <option value="codigo">Por código</option>
                        </select>
                        <input *ngIf="modoBusqueda === 'fecha'" type="date" class="form-control" name="fechaBusquedaEvento" [(ngModel)]="fechaBusqueda"/>
                        <input *ngIf="modoBusqueda === 'codigo'" type="text" class="form-control" name="codigoBusquedaEvento" placeholder="Código del evento" [(ngModel)]="codigoBusqueda"/>
                        <button type="button" class="btn btn-primary" (click)="buscarEvento()" [disabled]="buscandoEvento">{{buscandoEvento ? 'Buscando...' : 'Buscar'}}</button>
                    </div>
                    <div class="list-group event-search-results" *ngIf="eventos.length">
                        <button type="button" class="list-group-item list-group-item-action" *ngFor="let evento of eventos" (click)="seleccionarEvento(evento)">
                            <strong>{{evento.nombre}}</strong> <span class="text-muted">({{evento.codigo}})</span>
                            <div class="small text-muted">{{evento.inicio | date: 'dd/MM/yy HH:mm'}} · {{evento.estado}}</div>
                        </button>
                    </div>
                    </div>
                </div>
            </div>
        
            <div class="col-7"></div>

            <div class="col-lg-4 col-md-12 mb-4">
                <label for="monto">Monto</label>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <div class="input-group-text">$</div>
                    </div>
                    <input type="number" min="0" class="form-control" name="monto" [(ngModel)]="gasto.monto">
                </div>
            </div>

            <div class="col-lg-4 col-md-12 mb-4">
                <label for="medioDePago">Medio de pago</label>
                <select class="form-select" [(ngModel)]="gasto.medioDePago" name="medioDePago">
                    <option *ngFor="let medio of listaMedioDePago | orderAbmById" [value]="medio">{{medio | formatEnum}}</option>
                </select>
            </div>

        </div>
    </form>
</div>
