<div class="container">
    <form>

        <app-header
            titulo="Agregar pago"
            (outputVolver)="volver()"
            [botonSave]="true"
            (outputSave)="save()">
        </app-header>
        
        <div class="row contenedor-default mt-2">

            <div class="col-lg-8 mb-3 event-search" *ngIf="!botonBuscarDisabled && mostrarBusquedaEvento">
                <label class="d-block">Buscar evento</label>
                <div class="event-search-controls">
                    <select class="form-select" [(ngModel)]="modoBusqueda" name="modoBusquedaEvento">
                        <option value="fecha">Por fecha</option>
                        <option value="codigo">Por código</option>
                    </select>
                    <input *ngIf="modoBusqueda === 'fecha'" type="date" class="form-control" name="fechaBusquedaEvento" [(ngModel)]="fechaBusqueda"/>
                    <input *ngIf="modoBusqueda === 'codigo'" type="text" class="form-control" name="codigoEvento" placeholder="Código del evento" [(ngModel)]="codigo"/>
                    <button type="button" (click)="buscar()" [disabled]="buscando" class="btn btn-primary">{{buscando ? 'Buscando...' : 'Buscar'}}</button>
                </div>
                <div class="list-group event-search-results" *ngIf="eventos.length">
                    <button type="button" class="list-group-item list-group-item-action" *ngFor="let evento of eventos" (click)="seleccionarEvento(evento)">
                        <strong>{{evento.nombre}}</strong> <span class="text-muted">({{evento.codigo}})</span>
                        <div class="small text-muted">{{evento.inicio | date: 'dd/MM/yy HH:mm'}} · {{evento.estado}}</div>
                    </button>
                </div>
            </div>

            <div *ngIf="pago.codigo != ''">
                <div class="col-lg-4 col-md-12 mb-2">
                    <app-evento-seleccionado
                        [nombre]="pago.nombreEvento"
                        [codigo]="pago.codigo"
                        [fechaInicio]="pago.fechaEvento"
                        [permitirCambiar]="!botonBuscarDisabled"
                        (outputCambiar)="cambiarEvento()">
                    </app-evento-seleccionado>
                </div>
                <div class="col-lg-3 col-md-12 mb-2">
                    <label for="fechaPago">Fecha de pago</label>
                    <input type="datetime-local" class="form-control" name="fechaPago" [(ngModel)]="fechaPago"/>
                </div>
                <div class="col-lg-3 col-md-12 mb-2">
                    <label for="monto">Monto</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <div class="input-group-text">$</div>
                        </div>
                        <input type="number" class="form-control" name="monto" [(ngModel)]='pago.monto'>
                    </div>
                </div>
                <div class="col-lg-3 col-md-12 mb-2">
                    <label for="medioDePago">Medio de Pago</label> 
                    <select class="form-select" [(ngModel)]="pago.medioDePago" name="medioDePago">
                        <option *ngFor="let medioDePago of listaMedioDePago | orderAbmById" [value]="medioDePago">{{medioDePago | formatEnum}}</option>
                    </select>
                </div>
                <div class="col-lg-3 col-md-12 mb-2">
                    <label for="concepto">Concepto</label> 
                    <select class="form-select" (change)="cleanCouta()" [(ngModel)]="pago.concepto" name="concepto">
                        <option *ngFor="let concepto of listaConcepto | orderAbmById" [value]="concepto">{{concepto | formatEnum}}</option>
                    </select>
                </div>
                <div *ngIf="pago.concepto == 'CUOTA'">
                    <div class="col-lg-3 col-md-12">
                        <label for="numeroCuota">Numero de cuota</label> 
                        <input type="text" class="form-control" name="numeroCuota" [(ngModel)]="pago.numeroCuota"/>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
