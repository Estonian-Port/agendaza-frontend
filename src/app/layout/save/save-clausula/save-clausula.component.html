<div class="container">
    <form> 

        <app-header
            titulo="Agregar Clausula"
            (outputVolver)="volver()"
            [botonSave]="true"
            (outputSave)="save()">
        </app-header>

        <div class="row contenedor-default mt-2">
            <div class="col-lg-4 col-md-12 form-group mb-4">
                <label for="nombre">Nombre</label> 
                <input type="text" [(ngModel)]='genericItem.nombre' class="form-control" id="nombre" name="nombre">
            </div>
        </div>

    </form>
</div>
