<main class="container">
  <form [formGroup]="form" (ngSubmit)="save()" novalidate>

    <app-header
        [titulo]="'Actualiza tu contraseña'"
        [botonVolver]="false"
        [botonSave]="true"
        (outputSave)="save()">
    </app-header>

    <section class="row contenedor-default mt-2">
        <p class="col-12 text-muted mb-4">Para continuar, crea una nueva contraseña para tu cuenta.</p>

        <div class="form-group col-sm-12 col-md-5 mb-4">
            <div class="d-flex justify-content-between">
              <label for="password" class="form-label">Nueva contraseña</label>
              <span *ngIf="form.controls.password.touched && form.controls.password.invalid" class="text-danger small">
                  <ng-container *ngIf="form.controls.password.errors?.['required']">La contraseña es obligatoria.</ng-container>
                  <ng-container *ngIf="!form.controls.password.errors?.['required'] && form.controls.password.errors?.['minlength']">Debe tener al menos 8 caracteres.</ng-container>
                  <ng-container *ngIf="!form.controls.password.errors?.['required'] && !form.controls.password.errors?.['minlength'] && form.controls.password.errors?.['pattern']">Debe incluir una mayúscula y un número.</ng-container>
              </span>
            </div>
            <div class="position-relative">
              <input id="password" [type]="passwordVisible ? 'text' : 'password'" class="form-control pe-5" formControlName="password" autocomplete="new-password"
                  [ngClass]="{'is-invalid': form.controls.password.touched && form.controls.password.invalid}">
              <button type="button" class="text-decoration-none position-absolute end-0 top-50 translate-middle-y me-2 p-0 border-0"
                  (click)="passwordVisible = !passwordVisible" [attr.aria-label]="passwordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                  <i class="fas" [ngClass]="{'fa-eye': !passwordVisible, 'fa-eye-slash': passwordVisible}" aria-hidden="true"></i>
              </button>
            </div>
        </div>

        <div class="form-group col-sm-12 col-md-5 mb-4">
            <div class="d-flex justify-content-between">
              <label for="confirmarPassword" class="form-label">Confirmar contraseña</label>
              <span *ngIf="form.controls.confirmarPassword.touched && (form.controls.confirmarPassword.invalid || form.errors?.['passwordsMismatch'])" class="text-danger small">
                  <ng-container *ngIf="form.errors?.['passwordsMismatch']">Las contraseñas no coinciden.</ng-container>
                  <ng-container *ngIf="form.controls.confirmarPassword.errors?.['required']">Confirma la nueva contraseña.</ng-container>
              </span>
            </div>
            <div class="position-relative">
              <input id="confirmarPassword" [type]="passwordVisible ? 'text' : 'password'" class="form-control" formControlName="confirmarPassword" autocomplete="new-password"
                  [ngClass]="{'is-invalid': form.controls.confirmarPassword.touched && (form.controls.confirmarPassword.invalid || form.errors?.['passwordsMismatch'])}">
              <button type="button" class="text-decoration-none position-absolute end-0 top-50 translate-middle-y me-2 p-0 border-0"
                  (click)="passwordVisible = !passwordVisible" [attr.aria-label]="passwordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                  <i class="fas" [ngClass]="{'fa-eye': !passwordVisible, 'fa-eye-slash': passwordVisible}" aria-hidden="true"></i>
              </button>  
            </div>
      </div>

        <div *ngIf="errorSubmit" class="col-12">
            <div class="alert alert-danger mb-0" role="alert">{{ errorSubmit }}</div>
        </div>
    </section>
  </form>
</main>
