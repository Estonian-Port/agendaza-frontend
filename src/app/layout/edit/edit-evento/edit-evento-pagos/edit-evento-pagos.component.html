<div class="container">

    <app-header
        titulo="Estado de cuenta"
        (outputVolver)="volver()"
        [botonAgregar]="true"
        [botonEmail]="true"
        [botonDescargar]="true"
        [emailEnCurso]="emailEstadoCuentaEnCurso"
        [descargaEnCurso]="descargaEstadoCuentaEnCurso"
        (outputAgregar)="agregarPago()"
        (outputDescargar)="descargarEstadoCuenta()"
        (outputEnviarEmail)="enviarEmailEstadoCuenta()">
    </app-header>

    <div class="row contenedor-default mt-2">
        <div class="form-group col-lg-4 col-md-12 mb-4">
            <h5>Evento</h5>
            <input type="text" class="form-control" id="evento" [value]="eventoPago.nombre" disabled>
        </div>
        <div class="form-group col-lg-4 col-md-12 mb-4">
            <h5>Codigo</h5>
            <input type="text" class="form-control" id="codigo" [value]="eventoPago.codigo" disabled>
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-7">

            <div class="row contenedor-default mt-2 me-1 mb-2">
                <div class="form-group">
                    <h5>Lista de pagos</h5>
                    <div class="pagos-container">
                        <div class="extra-overflow">
                            <div class="extra-box" *ngFor="let pago of listaPago">
                                <div class="card-pagos">
                                    <div class="d-flex justify-content-between">
                                        {{pago.fecha | date: "dd/MM/yy"}} ${{pago.monto | formatNumero }} {{pago.medioDePago | formatEnum}}
                                        <div>
                                            <button type="button" (click)="enviarEmailPago(pago.id)" class="mx-2"
                                                [disabled]="emailsPagoEnCurso.has(pago.id)"
                                                [attr.aria-label]="emailsPagoEnCurso.has(pago.id) ? 'Enviando correo' : 'Enviar correo'">
                                                <span *ngIf="emailsPagoEnCurso.has(pago.id)" class="spinner-border spinner-border-sm text-primary" role="status" aria-hidden="true"></span>
                                                <i *ngIf="!emailsPagoEnCurso.has(pago.id)" class="fas fa-envelope text-primary" aria-hidden="true"></i>
                                            </button>
                                            <button type="button" (click)="descargarPago(pago.id)" class="mx-2"
                                                [disabled]="descargasPagoEnCurso.has(pago.id)"
                                                [attr.aria-label]="descargasPagoEnCurso.has(pago.id) ? 'Descargando comprobante' : 'Descargar comprobante'">
                                                <span *ngIf="descargasPagoEnCurso.has(pago.id)" class="spinner-border spinner-border-sm text-primary" role="status" aria-hidden="true"></span>
                                                <i *ngIf="!descargasPagoEnCurso.has(pago.id)" class="fas fa-download text-primary" aria-hidden="true"></i>
                                            </button>
                                            <button (click)="editarPago(pago.id)" class="mx-2">
                                                <i class="fas fa-edit text-warning"></i>
                                            </button>
                                            <button (click)="modalParaEliminar(pago.id, pago.nombreEvento)" class="mx-2">
                                                <i class="fas fa-trash text-danger"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-5 p-0">
            <div class="contenedor-default mt-2">
                <div class="form-group col-8">
                    <h5>Monto total abonado</h5>
                    <div class="input-group mb-4">
                        <div class="input-group-prepend">
                            <div class="input-group-text">$</div>
                        </div>
                        <input type="number" class="form-control" id="monto_abonado_total" [value]="abonado" disabled>
                    </div>
                </div>
                <div class="form-group col-8">
                    <h5>Monto faltante</h5>
                    <div class="input-group mb-4">
                        <div class="input-group-prepend">
                            <div class="input-group-text">$</div>
                        </div>
                        <input type="number" class="form-control" id="monto_faltante" [value]="faltante" disabled>
                    </div>					        
                </div>
                <div class="form-group col-8">
                    <h5>El precio total del evento</h5>
                    <div class="input-group mb-2">
                        <div class="input-group-prepend">
                            <div class="input-group-text">$</div>
                        </div>
                        <input type="number" class="form-control" id="presupuesto" [value]="eventoPago.precioTotal" disabled>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<app-modal-basico
    (outputAceptar)="eliminar()"
    (outputChangeModal)="setModal($event)"
    [modal]="modal"
    [titulo]="tituloModal"
    [cuerpo]="cuerpoModal"
    [boton]="botonModal">
</app-modal-basico>
