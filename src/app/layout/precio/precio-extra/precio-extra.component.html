<div class="container">
    <app-header
        titulo="Precio de extras"
        (outputVolver)="volver()"
        [botonSave]="true"
        (outputSave)="save()">
    </app-header>

    <section class="precio-periodo mt-4">
        <div class="precio-periodo-header">
            <h5>{{currentYear}}</h5>
            <button type="button" class="btn btn-primary" (click)="agregarPrecioCurrent()">
                <i class="fas fa-plus me-1" aria-hidden="true"></i>Agregar
            </button>
        </div>
        <div *ngIf="listaPrecioCurrent.length === 0" class="precio-vacio">Sin precios para este año</div>
        <div *ngFor="let precio of listaPrecioCurrent | orderByFechaDesdePrecio; let i=index">
            <app-precio-form
                (outputQuitarPrecio)="quitarPrecio($event)"
                [precio]="precio"
                [i]="i">
            </app-precio-form>
        </div>
    </section>

    <section class="precio-periodo mt-4 mb-4">
        <div class="precio-periodo-header">
            <h5>{{currentYear + 1}}</h5>
            <button type="button" class="btn btn-primary" (click)="agregarPrecioNext()">
                <i class="fas fa-plus me-1" aria-hidden="true"></i>Agregar
            </button>
        </div>
        <div *ngIf="listaPrecioNext.length === 0" class="precio-vacio">Sin precios para este año</div>
        <div *ngFor="let precio of listaPrecioNext | orderByFechaDesdePrecio; let i=index">
            <app-precio-form
                (outputQuitarPrecio)="quitarPrecio($event)"
                [precio]="precio"
                [i]="i">
            </app-precio-form>
        </div>
    </section>
</div>
